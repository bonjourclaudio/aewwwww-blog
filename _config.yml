# ─────────────────────────────────────────────
#  Site settings — edit these once, then forget
# ─────────────────────────────────────────────
title: "Embodied Interaction - Group 2"
description: "Materials, robots & thingssss"
course: "BA Interaction Design · ZHdK"   # shown in the header + footer
lang: en

# Custom domain (see CNAME) -> site lives at the root, so baseurl stays empty.
baseurl: ""
url: "https://embodied-interaction.siech.space"
cms_url: "https://app.pagescms.org/bonjourclaudio/aewwwww-blog/main/collection/posts"

# ─────────────────────────────────────────────
#  You shouldn't need to touch anything below
# ─────────────────────────────────────────────
permalink: /:year/:month/:day/:title/
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
timezone: Europe/Zurich

defaults:
  - scope: { path: "", type: "posts" }
    values: { layout: "post" }

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle

<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;0,600;1,400&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  <header class="site-header grid">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <span class="site-course">{{ site.course }}</span>
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>Index</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer grid">
    <span class="f1">{{ site.title }}</span>
    <span class="f2">{{ site.course }} · {{ 'now' | date: '%Y' }}</span>
    <a class="f3" href="{{ site.cms_url }}" rel="nofollow">Write a post</a>
  </footer>
</body>
</html>

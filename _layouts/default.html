<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
<div id="page">

  <header id="header">
    <h1 id="blog-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
    <p id="blog-description">{{ site.description }}</p>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer id="footer">
    <p>
      {{ site.course }} &middot; {{ 'now' | date: '%Y' }}<br>
      <a href="{{ site.cms_url }}" rel="nofollow">Write a post</a> &middot;
      <a href="{{ '/feed.xml' | relative_url }}">Atom feed</a>
    </p>
  </footer>

</div>

{% include lightbox.html %}
</body>
</html>

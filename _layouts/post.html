---
layout: default
---
{% include post-entry.html post=page body=content %}

<p class="post-nav">
  {% if page.previous %}<a href="{{ page.previous.url | relative_url }}">&larr; {{ page.previous.title }}</a> &middot; {% endif %}
  <a href="{{ '/' | relative_url }}">All posts</a>
  {% if page.next %} &middot; <a href="{{ page.next.url | relative_url }}">{{ page.next.title }} &rarr;</a>{% endif %}
</p>

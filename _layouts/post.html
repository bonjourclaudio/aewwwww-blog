---
layout: default
---
<h2 class="date-header">{{ page.date | date: '%A, %B %d, %Y' }}</h2>

{% include post-entry.html post=page body=content %}

<p class="post-nav">
  {% if page.previous %}<a href="{{ page.previous.url | relative_url }}">&laquo; {{ page.previous.title }}</a>{% endif %}
  {% if page.previous and page.next %} | {% endif %}
  <a href="{{ '/' | relative_url }}">Home</a>
  {% if page.next %} | <a href="{{ page.next.url | relative_url }}">{{ page.next.title }} &raquo;</a>{% endif %}
</p>
